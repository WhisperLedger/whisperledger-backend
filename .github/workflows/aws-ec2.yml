name: Deploy API to AWS EC2

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # This AWS account's included-credit plan is currently assigned to Sydney.
  # Do not change this to another region without upgrading/activating it first.
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: whisperledger-api

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  publish-and-deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish the immutable ARM64 image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx create --use
          docker buildx build --platform linux/arm64 --push \
            --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
      - name: Deploy through AWS Systems Manager
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          EC2_INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy WhisperLedger API $GITHUB_SHA" \
            --parameters commands="AWS_REGION=$AWS_REGION AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID IMAGE_URI=$IMAGE_URI API_DOMAIN=$API_DOMAIN /opt/whisperledger/deploy.sh" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
