services:
  api:
    image: ${IMAGE_URI:?IMAGE_URI must point to the immutable ECR image digest or tag}
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-/opt/whisperledger/runtime.env}
    expose:
      - "10000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:10000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
